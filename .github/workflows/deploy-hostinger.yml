# Despliegue automático de alexdasi.com
# Cada push a main sube los cambios a Hostinger por FTP (solo lo que ha cambiado).
# También se puede lanzar a mano desde la pestaña Actions (Run workflow).
# Secretos necesarios en GitHub: FTP_USERNAME y FTP_PASSWORD.
name: Deploy alexdasi.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 213.130.145.191
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose  # el host es una IP: el certificado de Hostinger no casa con ella
          server-dir: public_html/
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            node_modules/**
            scss/**
            prepros.config
            portfolio.code-workspace
            package.json
            package-lock.json
