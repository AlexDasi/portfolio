# Despliegue automático de alexdasi.com
# Cada push a main sube a Hostinger solo lo que ha cambiado (estado en domains/alexdasi.com/public_html/.ftp-deploy-sync-state.json).
# También se lanza a mano en Actions → Run workflow.
# Secretos: FTP_USERNAME y FTP_PASSWORD (cuenta FTP principal de Hostinger).
# Protocolo: FTP. Con FTPS, Hostinger corta la conexión de datos (425 Unable to build data connection).
name: Deploy alexdasi.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico de carpetas FTP (temporal)
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "domains/" "domains/alexdasi.com/" "domains/alexdasi.com/public_html/" "public_html/public_html/"; do
            echo "== /$d"; curl -s --max-time 20 --user "$U:$P" "ftp://213.130.145.191/$d" | head -n 25 || true
          done
          echo "== pwd"; curl -s --max-time 20 --user "$U:$P" -Q "PWD" "ftp://213.130.145.191/" -o /dev/null -v 2>&1 | grep -E "^< 257" || true

      - name: Subir a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 213.130.145.191
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: domains/alexdasi.com/public_html/
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vscode/**
            node_modules/**
            scss/**
            prepros.config
            portfolio.code-workspace
            package.json
            package-lock.json
            copilot-instructions.md

      - name: Comprobación rápida
        continue-on-error: true
        run: |
          c() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://alexdasi.com$1"; }
          echo "home: $(c /) · atelier: $(c /php-pages/projects/atelier.php) · docs bloqueado: $(c /docs/HANDOFF.md)"
          test "$(c /)" = 200
