# Despliegue automático de alexdasi.com
# Cada push a main sube a Hostinger solo lo que ha cambiado (estado en .ftp-deploy-sync-state.json, en la raíz de la web).
# También se lanza a mano en Actions → Run workflow.
# Usuario FTP de la web: u274648775.alexdasi.com (su raíz ES la carpeta de la web).
#   OJO: el usuario «u274648775» a secas entra en otra carpeta vacía que no es la web.
# Secreto: FTP_PASSWORD (la contraseña FTP principal de Hostinger; FTP_USERNAME ya no se usa).
# Protocolo: FTP. Con FTPS, Hostinger corta la conexión de datos (425 Unable to build data connection).
name: Deploy alexdasi.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Subir a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 213.130.145.191
          username: u274648775.alexdasi.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          log-level: minimal
          timeout: 120000
          exclude: |
            **/.git/**
            **/.gitignore
            **/.gitattributes
            .github/**
            .vscode/**
            node_modules/**
            scss/**
            prepros.config
            portfolio.code-workspace
            package.json
            package-lock.json
            copilot-instructions.md

      - name: Comprobación rápida
        run: |
          c() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://alexdasi.com$1"; }
          echo "home: $(c /) · atelier: $(c /php-pages/projects/atelier.php) · docs: $(c /docs/HANDOFF.md) · .git: $(c /.git/config)"
          test "$(c /)" = 200
          test "$(c /php-pages/projects/atelier.php)" = 200
