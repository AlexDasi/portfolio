<title>Sphere</title>
<!-- v14 (ATELIER conv. 1393): la esfera en calidad alta (three.js, elegida en el A/B de la conv. 1390). Fuente: esfera/hq/esfera-hq_embed.js -->
<script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add("embed");</script>
<link rel="preload" href="hq/estudio_esfera-hq_512.hdr" as="fetch" crossorigin>
<style>
  :root{--lima:#ECF98E}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  html.embed,html.embed body{background:transparent}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:none}
  body.embed.tactil canvas#c,body.embed.movil canvas#c{touch-action:pan-y}
  #cur{position:fixed;left:0;top:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .2s}
  #cur i{position:absolute;left:0;top:0;display:block;width:10px;height:10px;border-radius:50%;background:var(--lima);box-shadow:0 0 14px 4px color-mix(in srgb,var(--lima) 45%,transparent);transform:translate(-50%,-50%);transition:transform .2s,opacity .2s}
  #cur.down i{transform:translate(-50%,-50%) scale(1.7);opacity:.6}
  /* v16: cursores de las pieles tech (mira para alambre y maqueta, lente para rayos X) */
  #cur.cur--mira i{width:22px;height:22px;background:none;box-shadow:none;border:1px solid var(--lima);border-radius:50%}
  #cur.cur--mira::before,#cur.cur--mira::after{content:"";position:absolute;background:var(--lima);transform:translate(-50%,-50%)}
  #cur.cur--mira::before{width:34px;height:1px}#cur.cur--mira::after{width:1px;height:34px}
  #cur.cur--lente i{width:var(--lente,120px);height:var(--lente,120px);background:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lima) 70%,transparent)}
  body.tactil #cur{display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Sphere, drag to spin it in any direction"></canvas>
<div id="cur"><i></i></div>
<script type="module" src="esfera-hq.min.js?v=24"></script><!-- v20: con versión, para que el navegador no use la copia vieja (la E no llegaba desde dentro de la esfera) -->
<script>/* v17 (Alex, 21/11: «cuando el cursor toca la esfera, deja de aplicar el fluido del fondo»): la esfera le pasa a la
   página por dónde va el ratón (una vez por fotograma) y la página se lo da al fluido. js/esfera.js (puntero) */
if (parent !== window) (function () { var x = 0, y = 0, raf = 0;
  addEventListener('pointermove', function (e) { if (e.pointerType !== 'mouse') return; x = e.clientX; y = e.clientY;
    if (!raf) raf = requestAnimationFrame(function () { raf = 0; parent.postMessage({ esfera: 'puntero', x: x, y: y }, '*'); }); }, { passive: true });
})();</script>
</body>
