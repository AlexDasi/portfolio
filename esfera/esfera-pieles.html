<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

/* ?m=1|2|3 textura · ?still&t=s fotograma fijo · ?auto cursor fantasma (pruebas) */
const Q = new URLSearchParams(location.search), STILL = Q.has('still'), AUTO = Q.has('auto'), T0 = +(Q.get('t') || 0);
let modo = Math.min(5, Math.max(0, (+Q.get('m') || 1) - 1));
/* alexdasi.com (rama rediseno-baraja-2026-11): ?embed y ?piel= */
const EMBED = Q.has('embed');
if (EMBED) { document.body.classList.add('embed'); if (Q.has('movil')) document.body.classList.add('movil'); }
const PIELES = {solare: 0, chicle: 1, glaseado: 2, niebla: 3, gota: 4, prisma: 5};
if (Q.has('piel') && Q.get('piel') in PIELES) modo = PIELES[Q.get('piel')];
const avisar = (msg) => { if (EMBED && parent !== window) parent.postMessage({esfera: msg}, '*'); };
let pulsado = null;
const HINTS = [
  'Solare · pásale el cursor como un palo por el agua: se abre y vuelve con peso',
  'Chicle · pásale el cursor y se hunde; agárralo (clic y arrastra): se pega, te sigue girando y al soltar sigue rodando',
  'Glaseado · ráyalo: quitas la escarcha, se ve brillante por dentro y se vuelve a helar',
  'Niebla · mete la mano: el humo se mueve con ella y vuelve a su sitio',
  'Gota · pásale el dedo: la arrastras y gira; si le das fuerte, salpica como un cubo de agua y las gotas vuelven a caer',
  'Prisma · la cara bajo el cursor se enciende y te da su medida'
];
const LIMA = new THREE.Color('#ECF98E');

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: STILL});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.05;

/* ---------- ruido (simplex 3D, Ashima) ---------- */
const NOISE = /* glsl */`
vec3 m289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 m289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 perm(vec4 x){return m289(((x*34.)+1.)*x);}
vec4 tis(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=m289(i);
  vec4 p=perm(perm(perm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 nm=tis(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm3(vec3 p){return .55*snoise(p)+.3*snoise(p*2.03+7.1)+.15*snoise(p*4.1-3.7);}
float fbm4(vec3 p){return .5*snoise(p)+.27*snoise(p*2.03+7.1)+.15*snoise(p*4.1-3.7)+.08*snoise(p*8.3+1.9);}
`;

/* ---------- entorno: el mismo «mundo» del script de Blender (cálido a la izquierda, frío a la derecha, tira arriba, 3 discos de luz) ---------- */
function entorno(tech){
  const s = new THREE.Scene();
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      uWarm: {value: tech ? new THREE.Vector3(.75, .75, .8) : new THREE.Vector3(1, .45, .16)},
      uCold: {value: tech ? new THREE.Vector3(.35, .55, 1) : new THREE.Vector3(.18, .55, 1)},
      uKey: {value: tech ? new THREE.Vector3(1, .97, .92).multiplyScalar(3.2) : new THREE.Vector3(1, .6, .3).multiplyScalar(4)},
      uKeyDir: {value: tech ? new THREE.Vector3(-3, 2.2, 2.2) : new THREE.Vector3(-3, 1.6, 2)},
      uRim: {value: tech ? new THREE.Vector3(.4, .6, 1).multiplyScalar(4.5) : new THREE.Vector3(.3, .6, 1).multiplyScalar(5.5)},
      uTop: {value: tech ? 2.2 : 1.8}
    },
    vertexShader: `varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: `varying vec3 vD;uniform vec3 uWarm,uCold,uKey,uKeyDir,uRim;uniform float uTop;
      vec3 disco(vec3 d,vec3 c,float r,vec3 col){return col*smoothstep(cos(r),cos(r*.55),dot(d,normalize(c)));}
      void main(){
        vec3 d=normalize(vD);float f=d.x*.5+.5;
        vec3 c=mix(uWarm,vec3(.08,.03,.01),smoothstep(0.,.3,f));
        c=mix(c,vec3(0.),smoothstep(.3,.5,f));
        c=mix(c,vec3(.01,.03,.08),smoothstep(.5,.7,f));
        c=mix(c,uCold,smoothstep(.7,1.,f));
        c+=vec3(smoothstep(.55,.9,d.y)*1.4);
        c+=disco(d,uKeyDir,.42,uKey);
        c+=disco(d,vec3(3.2,.4,-.3),.5,uRim);
        c+=disco(d,vec3(0.,3.4,1.),.22,vec3(uTop));
        gl_FragColor=vec4(c,1.);
      }`
  });
  s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 64, 32), m));
  const pm = new THREE.PMREMGenerator(renderer);
  const pmrem = pm.fromScene(s, 0).texture; pm.dispose();
  const crt = new THREE.WebGLCubeRenderTarget(256, {type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter});
  new THREE.CubeCamera(.1, 100, crt).update(renderer, s);
  return {pmrem, cube: crt.texture};
}
const ENV_ORG = entorno(false), ENV_TECH = entorno(true);

/* ---------- fluido de alexdasi.com (WebGL Fluid de P. Dobryakov) pero PEGADO A LA BOLA: la simulación corre en el mapa
   equirectangular de la esfera (256×128, tinta 1024×512, costura en longitud), así el rastro sigue la curvatura y gira con ella.
   Configuración = la del panel FX que pasó Alex (conv. 1035): densidad 0,35 (el rastro dura), velocidad 1,05, vorticidad 0,
   presión 50 iteraciones, radio 0,19 (aquí 0,12 para que no sea tan grande sobre la bola), fuerza 12000, sombreado sí. */
const fluido = (() => {
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), esc = new THREE.Scene(), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); esc.add(quad);
  const RT = (w, h) => new THREE.WebGLRenderTarget(w, h, {type: THREE.HalfFloatType, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, wrapS: THREE.RepeatWrapping});
  const doble = (w, h) => { let a = RT(w, h), b = RT(w, h); return {get read(){return a}, get write(){return b}, swap(){[a, b] = [b, a]}}; };
  const vel = doble(256, 128), pres = doble(256, 128), dye = doble(1024, 512), div = RT(256, 128), curl = RT(256, 128);
  const texel = new THREE.Vector2(1 / 256, 1 / 128), dyeTexel = new THREE.Vector2(1 / 1024, 1 / 512);
  const VS = `varying vec2 vUv,vL,vR,vT,vB;uniform vec2 texel;void main(){vUv=uv;vL=uv-vec2(texel.x,0.);vR=uv+vec2(texel.x,0.);vT=uv+vec2(0.,texel.y);vB=uv-vec2(0.,texel.y);gl_Position=vec4(position.xy,0.,1.);}`;
  const M = (fs, u) => new THREE.ShaderMaterial({vertexShader: VS, fragmentShader: 'varying vec2 vUv,vL,vR,vT,vB;uniform vec2 texel;' + fs, uniforms: Object.assign({texel: {value: texel}}, u), depthTest: false, depthWrite: false});
  const splat = M(`uniform sampler2D uT;uniform float radius;uniform vec3 color;uniform vec2 point;
    void main(){vec2 p=vUv-point;p.x=fract(p.x+.5)-.5;p.x*=2.*cos((vUv.y-.5)*3.14159);gl_FragColor=vec4(texture2D(uT,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
    {uT: {value: null}, radius: {value: .0012}, color: {value: new THREE.Vector3()}, point: {value: new THREE.Vector2()}});
  const curlM = M(`uniform sampler2D uV;void main(){float L=texture2D(uV,vL).y,R=texture2D(uV,vR).y,T=texture2D(uV,vT).x,B=texture2D(uV,vB).x;gl_FragColor=vec4(.5*(R-L-T+B),0.,0.,1.);}`, {uV: {value: null}});
  const vort = M(`uniform sampler2D uV,uC;uniform float curl,dt;void main(){
    float L=texture2D(uC,vL).x,R=texture2D(uC,vR).x,T=texture2D(uC,vT).x,B=texture2D(uC,vB).x,C=texture2D(uC,vUv).x;
    vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;
    gl_FragColor=vec4(clamp(texture2D(uV,vUv).xy+f*dt,-1000.,1000.),0.,1.);}`, {uV: {value: null}, uC: {value: null}, curl: {value: 0}, dt: {value: .016}});
  const divM = M(`uniform sampler2D uV;void main(){
    float L=texture2D(uV,vL).x,R=texture2D(uV,vR).x,T=texture2D(uV,vT).y,B=texture2D(uV,vB).y;vec2 C=texture2D(uV,vUv).xy;
    if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;gl_FragColor=vec4(.5*(R-L+T-B),0.,0.,1.);}`, {uV: {value: null}});
  const clr = M(`uniform sampler2D uT;uniform float k;void main(){gl_FragColor=k*texture2D(uT,vUv);}`, {uT: {value: null}, k: {value: 0}});
  const presM = M(`uniform sampler2D uP,uD;void main(){float L=texture2D(uP,vL).x,R=texture2D(uP,vR).x,T=texture2D(uP,vT).x,B=texture2D(uP,vB).x;
    gl_FragColor=vec4((L+R+B+T-texture2D(uD,vUv).x)*.25,0.,0.,1.);}`, {uP: {value: null}, uD: {value: null}});
  const grad = M(`uniform sampler2D uP,uV;void main(){float L=texture2D(uP,vL).x,R=texture2D(uP,vR).x,T=texture2D(uP,vT).x,B=texture2D(uP,vB).x;
    gl_FragColor=vec4(texture2D(uV,vUv).xy-vec2(R-L,T-B),0.,1.);}`, {uP: {value: null}, uV: {value: null}});
  const adv = M(`uniform sampler2D uV,uS;uniform float dt,dis;void main(){vec2 c=vUv-dt*texture2D(uV,vUv).xy*texel;gl_FragColor=texture2D(uS,c)/(1.+dis*dt);}`,
    {uV: {value: null}, uS: {value: null}, dt: {value: .016}, dis: {value: 1}});
  const run = (m, t) => { quad.material = m; renderer.setRenderTarget(t); renderer.render(esc, cam); };
  const prev0 = renderer.getRenderTarget(); for (const d of [vel, pres, dye]) for (const r of [d.read, d.write]) { renderer.setRenderTarget(r); renderer.clear(); } renderer.setRenderTarget(prev0);
  const cola = [];
  return {
    vel, dye, texel, dyeTexel,
    toque(u, v, du, dv){ cola.push([u, v, du, dv]); },
    paso(dt){
      const prev = renderer.getRenderTarget();
      for (const [u, v, du, dv] of cola.splice(0)) {
        splat.uniforms.point.value.set(u, v);
        splat.uniforms.uT.value = vel.read.texture; splat.uniforms.color.value.set(du * 12000, dv * 12000, 0); run(splat, vel.write); vel.swap();
        splat.uniforms.uT.value = dye.read.texture; splat.uniforms.color.value.set(.35, .35, .35); run(splat, dye.write); dye.swap();
      }
      curlM.uniforms.uV.value = vel.read.texture; run(curlM, curl);
      vort.uniforms.uV.value = vel.read.texture; vort.uniforms.uC.value = curl.texture; vort.uniforms.dt.value = dt; run(vort, vel.write); vel.swap();
      divM.uniforms.uV.value = vel.read.texture; run(divM, div);
      clr.uniforms.uT.value = pres.read.texture; run(clr, pres.write); pres.swap();
      presM.uniforms.uD.value = div.texture;
      for (let i = 0; i < 50; i++) { presM.uniforms.uP.value = pres.read.texture; run(presM, pres.write); pres.swap(); }
      grad.uniforms.uP.value = pres.read.texture; grad.uniforms.uV.value = vel.read.texture; run(grad, vel.write); vel.swap();
      adv.uniforms.dt.value = dt; adv.uniforms.uV.value = vel.read.texture; adv.uniforms.uS.value = vel.read.texture; adv.uniforms.dis.value = 1.05; run(adv, vel.write); vel.swap();
      adv.uniforms.uV.value = vel.read.texture; adv.uniforms.uS.value = dye.read.texture; adv.uniforms.dis.value = .35; run(adv, dye.write); dye.swap();
      renderer.setRenderTarget(prev);
    }
  };
})();
const UV_GLSL = `vec2 uvEsf(vec3 p){vec3 q=normalize(p);return vec2(atan(q.z,q.x)/6.2831853+.5,asin(clamp(q.y,-1.,1.))/3.14159265+.5);}`;

/* uniforms compartidos */
const U = {
  uTime: {value: 0}, uRes: {value: new THREE.Vector2(1, 1)}, uVel: {value: null}, uDye: {value: null}, uDyeTexel: {value: fluido.dyeTexel}, uTexel: {value: fluido.texel}, uVelK: {value: .16}
};

/* ---------- escena ---------- */
const scene = new THREE.Scene(); scene.background = new THREE.Color(0);
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
const objetos = [];

/* 01 · Solare lima — mate y luminosa desde dentro. El cursor es un palo en el agua: el fluido de alexdasi.com abre el gas en un
   surco fino que se ensancha (presión), con peso, y vuelve a cerrarse en ~1 s. */
const solare = (() => {
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({uCamObj: {value: new THREE.Vector3()}, uViewToObj: {value: new THREE.Matrix3()}, uEnv: {value: ENV_ORG.cube}}, U),
    vertexShader: `varying vec3 vPos,vN,vW;void main(){vPos=position;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader: NOISE + UV_GLSL + `
      varying vec3 vPos,vN,vW;
      uniform float uTime,uVelK;uniform vec2 uRes,uDyeTexel,uTexel;uniform vec3 uCamObj;uniform mat3 uViewToObj;uniform samplerCube uEnv;uniform sampler2D uVel,uDye;
      void main(){
        vec2 suv=uvEsf(vPos);                                                   // el fluido vive en la piel de la bola
        vec2 vu=texture2D(uVel,suv).xy*uTexel*uVelK;
        vec3 sq=normalize(vPos);float lon=atan(sq.z,sq.x),lat=asin(clamp(sq.y,-1.,1.));
        vec3 este=vec3(-sin(lon),0.,cos(lon)),norte=vec3(-sin(lat)*cos(lon),cos(lat),-sin(lat)*sin(lon));
        vec3 warp=este*vu.x*6.2832*cos(lat)+norte*vu.y*3.1416;                  // el agua se aparta con el palo
        float tinta=clamp(texture2D(uDye,suv).r,0.,1.2);
        vec2 e2=uDyeTexel*2.;
        vec2 gr=.6*vec2(texture2D(uDye,suv+vec2(e2.x,0.)).r-texture2D(uDye,suv-vec2(e2.x,0.)).r,texture2D(uDye,suv+vec2(0.,e2.y)).r-texture2D(uDye,suv-vec2(0.,e2.y)).r);
        vec3 N=normalize(vN),V=normalize(cameraPosition-vW);float ndv=clamp(dot(N,V),0.,1.);
        vec3 rd=normalize(vPos-uCamObj);rd=normalize(mix(rd,-normalize(vPos),.3));
        float chord=max(-2.*dot(rd,vPos),.05);
        float t=uTime*.055;
        vec3 dw=vec3(snoise(vPos*.9+vec3(t,0.,0.)),snoise(vPos*.9+vec3(5.2,-t,1.3)),0.)*.45;
        float acc=0.,ws=0.;
        for(int i=0;i<6;i++){
          float s=float(i)/5.;vec3 p=vPos+rd*s*chord*.7;
          float w=exp(-s*3.6);
          // la capa de fuera es la más densa y la que se lleva el dedo; las de dentro, menos (paralaje)
          float n=fbm4((p-warp*mix(1.,.4,s))*2.1+dw+vec3(t,-t*.7,t*.45));
          acc+=n*w*(i==0?1.6:1.);ws+=w*(i==0?1.6:1.);
        }
        float g=acc/ws*.74+.52;
        g+=.045*snoise((vPos-warp)*7.5+vec3(0.,t*2.,0.));
        g=clamp(g,0.,1.);
        vec3 lo=vec3(.50,.66,.06),mi=vec3(.62,.80,.09),hi=vec3(.86,.98,.40);
        vec3 gas=mix(lo,mi,smoothstep(.25,.5,g));gas=mix(gas,hi,smoothstep(.5,.82,g));
        float em=mix(.62,1.3,smoothstep(.35,.75,g));
        vec3 Lw=normalize(vec3(-.75,.45,.5)),Lc=normalize(vec3(.95,.05,-.1));
        float dW=max(dot(N,Lw)*.6+.4,0.),dC=pow(max(dot(N,Lc),0.),1.5);
        vec3 col=gas*em*(.62+.38*dW)*.92;
        col+=vec3(1.,.55,.25)*dW*.08;
        col+=vec3(.3,.6,1.)*dC*.42*(.35+.65*(1.-ndv));
        col*=mix(.5,1.,pow(ndv,.55));
        col+=textureLod(uEnv,reflect(-V,N),6.).rgb*.05*(.25+.75*pow(1.-ndv,3.));
        col*=1.-min(tinta,1.)*.32;                                              // el surco abierto, más hondo
        float borde=clamp(length(gr)*4.,0.,1.);
        col+=vec3(.9,1.,.5)*borde*.32*(.6+.4*dot(normalize(gr+1e-5),vec2(-.7,.7)));   // sus bordes cogen luz (como el sombreado de tu web)
        gl_FragColor=vec4(col,1.);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 120), m);
  return {mesh, m, radio: 1, prev: null};
})();

/* 02 · Chicle — cuerpo blando: el dedo lo hunde, el borde se levanta, rebota y tiembla (muelle) */
const chicle = (() => {
  const m = new THREE.MeshPhysicalMaterial({
    color: '#C8E83A', roughness: .4, clearcoat: .45, clearcoatRoughness: .28,
    sheen: .35, sheenColor: new THREE.Color('#F4FFC0'), sheenRoughness: .5,
    emissive: new THREE.Color('#9cbf1a'), emissiveIntensity: .3,
    envMap: ENV_ORG.pmrem, envMapIntensity: .8
  });
  const huellas = Array.from({length: 24}, () => new THREE.Vector4(0, 0, 1, 0));
  const pell = [0, 1].map(() => ({a: new THREE.Vector3(0, 0, 1), d: new THREE.Vector3(), v: new THREE.Vector3(), obj: new THREE.Vector3(), activo: false}));
  const u = {uHit: {value: new THREE.Vector3(0, 0, 1)}, uDent: {value: 0}, uWob: {value: 0}, uSig: {value: .46}, uH: {value: huellas}, uPA: {value: pell.map(p => p.a)}, uPD: {value: pell.map(p => p.d)}};
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>
      uniform float uTime,uDent,uWob,uSig;uniform vec3 uHit;uniform vec4 uH[24];uniform vec3 uPA[2],uPD[2];
      ${NOISE}
      vec3 dispP(vec3 p){
        float d=.12*snoise(p*1.0+vec3(0.,0.,uTime*.07))+.018*snoise(p*2.2-vec3(uTime*.05));
        float r=distance(p,uHit);
        float hu=uDent*exp(-pow(r/uSig,2.2)),ro=uDent*.12*exp(-pow((r-uSig*1.25)/.16,2.));   // marca del hover (yema de dedo)
        for(int i=0;i<24;i++){vec4 h=uH[i];if(h.w<.001)continue;float rr=distance(p,h.xyz);   // huellas fijas: se quedan y giran con él
          hu+=h.w*exp(-pow(rr/uSig,3.));ro+=h.w*.2*exp(-pow((rr-uSig*1.3)/.13,2.));}
        float hond=.3*(1.-exp(-hu/.3));                 // suma suave: un surco no se hace más hondo que un dedo, y sin aristas
        d+=ro*exp(-hu*9.)-hond;                          // el rodete solo fuera del hueco
        d+=uWob*sin(r*9.-uTime*16.)*exp(-r*2.);
        vec3 q=p*(1.+d);
        for(int i=0;i<2;i++){float rp=distance(p,uPA[i]);q+=uPD[i]*exp(-pow(rp/.36,2.));}   // pellizcos: la masa se estira con el dedo
        return q;
      }`)
      .replace('#include <beginnormal_vertex>', `
        vec3 pp=normalize(position);vec3 up=abs(pp.y)<.99?vec3(0.,1.,0.):vec3(1.,0.,0.);
        vec3 t1=normalize(cross(pp,up)),t2=cross(pp,t1);float ee=.01;
        vec3 P0=dispP(pp),P1=dispP(normalize(pp+t1*ee)),P2=dispP(normalize(pp+t2*ee));
        vec3 objectNormal=normalize(cross(P1-P0,P2-P0));if(dot(objectNormal,pp)<0.)objectNormal=-objectNormal;`)
      .replace('#include <begin_vertex>', 'vec3 transformed=P0;');
  };
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 56), m);
  const sp = {dent: 0, v: 0, wob: 0, hit: new THREE.Vector3(0, 0, 1), ultima: null, n: 0};
  const hv = huellas.map(() => ({obj: 0, v: 0}));
  return {mesh, m, u, sp, huellas, hv, pell, radio: 1.08, pi: 0, agarre: null, w: new THREE.Vector3()};
})();

/* Pincel: mapa equirectangular pegado a la bola; el cursor pinta (0..1) y se va curando solo. Lo usan glaseado, niebla y aceite. */
function pincel(cura, radio = .28){
  const RT = () => new THREE.WebGLRenderTarget(256, 128, {type: THREE.HalfFloatType, depthBuffer: false, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, wrapS: THREE.RepeatWrapping});
  let a = RT(), b = RT();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), esc = new THREE.Scene();
  const m = new THREE.ShaderMaterial({
    uniforms: {uT: {value: null}, uHit: {value: new THREE.Vector3(0, 0, 1)}, uAmt: {value: 0}, uRad: {value: radio}, uCura: {value: 1}},
    vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader: `varying vec2 vUv;uniform sampler2D uT;uniform vec3 uHit;uniform float uAmt,uRad,uCura;const float PI=3.14159265;
      void main(){float lo=(vUv.x-.5)*2.*PI,la=(vUv.y-.5)*PI;vec3 q=vec3(cos(la)*cos(lo),sin(la),cos(la)*sin(lo));
        float o=texture2D(uT,vUv).r*uCura+uAmt*exp(-pow(distance(q,uHit)/uRad,2.));gl_FragColor=vec4(min(o,1.),0.,0.,1.);}`
  });
  esc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), m));
  const pv0 = renderer.getRenderTarget(); for (const r of [a, b]) { renderer.setRenderTarget(r); renderer.clear(); } renderer.setRenderTarget(pv0);
  return {
    get tex(){ return a.texture; },
    pintar(hit, amt){ m.uniforms.uHit.value.copy(hit); m.uniforms.uAmt.value = amt; },
    paso(dt){ m.uniforms.uT.value = a.texture; m.uniforms.uCura.value = Math.exp(-dt * cura);
      const pv = renderer.getRenderTarget(); renderer.setRenderTarget(b); renderer.render(esc, cam); renderer.setRenderTarget(pv); [a, b] = [b, a]; m.uniforms.uAmt.value = 0; }
  };
}
const PIN_GLSL = `float pin(sampler2D t,vec3 p){vec3 q=normalize(p);return texture2D(t,vec2(atan(q.z,q.x)/6.2831853+.5,asin(clamp(q.y,-1.,1.))/3.14159265+.5)).r;}`;

/* 03 · Glaseado — escarcha lima con cristalitos; el cursor la raja (un trazo fino, solo si mueves): debajo, cristal brillante con un
   caramelo lima que brilla dentro. La escarcha vuelve a crecer desde los bordes en unos segundos. */
const glaseado = (() => {
  const pin = pincel(.28, .14);
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({uCamObj: {value: new THREE.Vector3()}, uM3: {value: new THREE.Matrix3()}, uEnv: {value: ENV_ORG.cube}, uPin: {value: null}}, U),
    vertexShader: `varying vec3 vPos,vN,vW;void main(){vPos=position;vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader: NOISE + PIN_GLSL + `varying vec3 vPos,vN,vW;
      uniform float uTime;uniform vec3 uCamObj;uniform mat3 uM3;uniform samplerCube uEnv;uniform sampler2D uPin;
      void main(){
        vec3 N=normalize(vN),V=normalize(cameraPosition-vW);float ndv=clamp(dot(N,V),0.,1.);
        vec3 pw=uM3*vPos;
        float luz=mix(1.15,.75,smoothstep(-.9,.9,pw.x))*(.55+.45*max(dot(N,normalize(vec3(-.6,.5,.6))),0.));
        // escarcha: grano de cristalitos + destellos que cambian con la mirada
        float cr=abs(snoise(vPos*16.))*.6+abs(snoise(vPos*41.))*.4;
        float brillo=pow(max(snoise(vPos*70.+V*3.),0.),14.)*1.6;
        vec3 escarcha=mix(vec3(.66,.8,.24),vec3(.88,.95,.6),smoothstep(.1,.9,cr))*luz+vec3(1.,1.,.85)*brillo*.6;
        escarcha+=vec3(.3,.6,1.)*pow(1.-ndv,2.5)*.25*smoothstep(-.2,.9,pw.x);
        // la raja: cristal limpio con el caramelo lima brillando dentro
        float raja=pin(uPin,vPos);
        float hielo=smoothstep(.18,.5,raja+.22*(cr-.5));                       // los bordes de la raja, cristalinos
        vec3 rd=normalize(vPos-uCamObj),acc=vec3(0.);
        float chord=max(-2.*dot(rd,vPos),.05);
        for(int k=0;k<6;k++){vec3 p=vPos+rd*(float(k)+.5)*chord/6.;float r=length(p);
          float banda=.5+.5*sin(r*16.+fbm3(p*2.)*3.+uTime*.2);acc+=vec3(.7,.9,.15)*(.35+.65*banda)*exp(-r*1.2)*chord/6.*1.6;}
        float F=.04+.96*pow(1.-ndv,5.);
        vec3 limpio=acc+textureLod(uEnv,reflect(-V,N),.6).rgb*(F*.9+.04);
        gl_FragColor=vec4(mix(escarcha,limpio,hielo),1.);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), m);
  return {mesh, m, pin, radio: 1, prev: null};
})();

/* 04 · Niebla — bola de humo densa y esférica. El cursor es una mano metida dentro: arrastra el humo con ella (estela de 8 puntos
   con su velocidad) y lo aparta; al irse, cada punto se apaga y el humo vuelve a su sitio. */
const niebla = (() => {
  const mano = Array.from({length: 8}, () => new THREE.Vector4(0, 0, 0, 0)), manoV = Array.from({length: 8}, () => new THREE.Vector3());
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({uCamObj: {value: new THREE.Vector3()}, uM3: {value: new THREE.Matrix3()}, uMano: {value: mano}, uManoV: {value: manoV}}, U),
    vertexShader: `varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader: NOISE + `varying vec3 vPos;
      uniform float uTime;uniform vec3 uCamObj;uniform mat3 uM3;uniform vec4 uMano[8];uniform vec3 uManoV[8];
      vec3 remueve(vec3 p){vec3 d=vec3(0.);for(int i=0;i<8;i++){vec4 h=uMano[i];if(h.w<.01)continue;vec3 r=p-h.xyz;float g=h.w*exp(-dot(r,r)/.07);
        float g2=h.w*exp(-dot(r,r)/.16);d+=g2*uManoV[i]*.34+g*normalize(r+1e-4)*.16;}return d;}
      void main(){
        vec3 rd=normalize(vPos-uCamObj),ro=vPos;
        float chord=max(-2.*dot(rd,ro),.05),ds=chord/22.,t=uTime*.07;
        float jit=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453);
        vec3 T=vec3(1.),acc=vec3(0.);
        for(int k=0;k<22;k++){
          vec3 p=ro+rd*(float(k)+jit)*ds,q=p-remueve(p);
          float lq=length(q);if(lq>1.34)continue;                                    // aire vacío: no se calcula
          float bola=smoothstep(1.,.74,lq+.1*fbm3(q*1.6+vec3(t,0.,-t)));            // esférica, borde de humo fino
          float hal=lq>.86?smoothstep(1.32,.96,lq+.22*fbm3(q*2.7-vec3(t*1.3,0.,t)))*.3:0.;   // jirones que se escapan (sin máscara)
          float d=max(bola*(.75+.9*smoothstep(-.35,.6,fbm3(q*2.3+vec3(-t,t*.7,t*.4)))),hal);
          if(d<.002)continue;
          vec3 pw=uM3*p;
          vec3 L=mix(vec3(1.,.82,.55)*1.1,vec3(.5,.7,1.)*.85,smoothstep(-.9,.9,pw.x))*(.5+.5*clamp(pw.y*.6+.5,0.,1.))+vec3(.4,.5,.08);
          acc+=T*d*vec3(.9,.98,.62)*L*ds*1.25;
          T*=exp(-d*3.4*ds);
        }
        gl_FragColor=vec4(acc,1.);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 96, 72), m);   // v8: proxy grande, la niebla ya no choca con una esfera invisible
  return {mesh, m, mano, manoV, edad: mano.map(() => 9), n: 0, prev: null, radio: 1};
})();

/* 05 · Gota — gota de aceite oliva flotando. v8 (conv. 1048): vetas de aceite en la propia gota (se ve que gira), el dedo la
   arrastra y la hace girar, el surco aparta el aceite y lo amontona a los lados; con un trazo fuerte salpica como un cubo de agua:
   un abanico de gotas de tamaños distintos que vuela en la dirección del dedo, cae por gravedad y al volver abre ondas en la superficie. */
const MAT_GOTA = {color: '#7f9418', metalness: .85, roughness: .27, clearcoat: .6, clearcoatRoughness: .1,
  iridescence: .5, iridescenceIOR: 1.4, iridescenceThicknessRange: [240, 420], envMap: ENV_ORG.pmrem, envMapIntensity: 1.25};
const N_GOTITAS = 18, N_ONDAS = 8;
const aceite = (() => {
  const surcos = Array.from({length: 10}, () => new THREE.Vector4(0, 0, 1, 0));
  const ondas = Array.from({length: N_ONDAS}, () => new THREE.Vector4(0, 0, 1, 9)), ondaA = new Float32Array(N_ONDAS);
  const u = {uS: {value: surcos}, uOn: {value: ondas}, uOnA: {value: ondaA}};
  const m = new THREE.MeshPhysicalMaterial(MAT_GOTA);
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u); sh.uniforms.uTime = U.uTime;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', `#include <common>\nvarying vec3 vObj;uniform float uTime;uniform vec4 uS[10],uOn[${N_ONDAS}];uniform float uOnA[${N_ONDAS}];\n` + NOISE + `
      vec3 dispA(vec3 p){
        float d=.035*snoise(p*.9+vec3(0.,uTime*.12,0.))+.012*snoise(p*2.2-vec3(uTime*.1));
        for(int i=0;i<10;i++){vec4 s=uS[i];if(abs(s.w)<.001)continue;float r=distance(p,s.xyz);
          d-=s.w*exp(-r*r/.03);d+=s.w*.4*exp(-pow((r-.23)/.07,2.));}            // surco + labio: el aceite apartado se amontona al lado
        for(int i=0;i<${N_ONDAS};i++){vec4 o=uOn[i];if(o.w>2.2)continue;float fr=distance(p,o.xyz)-.62*o.w;   // onda que corre
          d+=uOnA[i]*exp(-o.w*2.4)*cos(fr*26.)*exp(-fr*fr*110.);}
        return p*(1.+d);}`)
      .replace('#include <beginnormal_vertex>', `vec3 pp=normalize(position);vObj=pp;vec3 up=abs(pp.y)<.99?vec3(0.,1.,0.):vec3(1.,0.,0.);
        vec3 t1=normalize(cross(pp,up)),t2=cross(pp,t1);vec3 P0=dispA(pp),P1=dispA(normalize(pp+t1*.01)),P2=dispA(normalize(pp+t2*.01));
        vec3 objectNormal=normalize(cross(P1-P0,P2-P0));if(dot(objectNormal,pp)<0.)objectNormal=-objectNormal;`)
      .replace('#include <begin_vertex>', 'vec3 transformed=P0;');
    // vetas del aceite pegadas a la gota: más oscuras y más mates en unas zonas → se lee el giro
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;uniform float uTime;\n' + NOISE)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float veta=fbm3(vObj*vec3(1.6,4.2,1.6)+vec3(snoise(vObj*1.3+uTime*.03)*.8,0.,0.));
        diffuseColor.rgb*=mix(.74,1.12,smoothstep(-.35,.45,veta));`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor*=mix(1.5,.75,smoothstep(-.35,.45,veta));`);
  };
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 56), m);
  const mg = new THREE.MeshPhysicalMaterial(MAT_GOTA), gotitas = [], geoG = new THREE.SphereGeometry(1, 20, 14);
  for (let i = 0; i < N_GOTITAS; i++) { const g = new THREE.Mesh(geoG, mg); g.visible = false; scene.add(g); gotitas.push({mesh: g, v: new THREE.Vector3(), r: 0, vivo: false, t: 0}); }
  return {mesh, m, u, surcos, ondas, ondaA, on: 0, edades: surcos.map(() => 9), n: 0, gotitas, prev: null, ultSalpica: -9, radio: 1, vel: 0, pico: 0, ultimo: null, pxPrev: null, dir: null,
    w: new THREE.Vector3(), rocio: 0};
})();
function ondaGota(A, pW, amp){ const k = A.on++ % N_ONDAS; A.ondas[k].copy(new THREE.Vector4(...A.mesh.worldToLocal(pW.clone()).normalize().toArray(), 0)); A.ondaA[k] = amp; }
function salpica(A, pW, dirW, f, cuantas){   // abanico: hacia donde iba el dedo + hacia fuera + algo de lado; muchas pequeñas y alguna gorda
  const nW = pW.clone().sub(A.mesh.position).normalize(), tg = dirW.clone().addScaledVector(nW, -dirW.dot(nW)).normalize(), lado = nW.clone().cross(tg).normalize();
  for (const gt of A.gotitas.filter(x => !x.vivo).slice(0, cuantas)) {
    const z = Math.random(); gt.vivo = true; gt.t = 0; gt.r = .012 + .05 * Math.pow(z, 2.6);
    const sp = (1 - z * .5) * f;                                                         // las pequeñas salen más rápido
    gt.mesh.position.copy(pW).addScaledVector(nW, .03 + gt.r);
    gt.v.copy(tg).multiplyScalar((.8 + Math.random() * .6) * sp).addScaledVector(nW, (.9 + Math.random() * .7) * sp).addScaledVector(lado, (Math.random() - .5) * .55 * sp);
  }
}
/* 06 · Prisma lima (tech) — icosaedro liso de metacrilato lima, en dos pasadas; la cara bajo el cursor se enciende y da su medida */
function cristal({pos, mask, face, caras, bev, cuarzo}){
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.computeVertexNormals();
  const n = pos.length / 3, bary = new Float32Array(n * 3), glow = new Float32Array(n);
  for (let i = 0; i < n; i++) bary[i * 3 + (i % 3)] = 1;
  geo.setAttribute('aBary', new THREE.BufferAttribute(bary, 3));
  geo.setAttribute('aMask', new THREE.BufferAttribute(mask, 3));
  geo.setAttribute('aGlow', new THREE.BufferAttribute(glow, 1));
  const FS = NOISE + `varying vec3 vB,vM,vN,vW,vS,vO;varying float vG;
      uniform samplerCube uEnv;uniform vec3 uLima;uniform float uBack,uQ,uBev;
      void main(){
        vec3 Nf=normalize(vN);
        vec3 bb=vB+(1.-vM);float e=min(min(bb.x,bb.y),bb.z);
        float linea=1.-smoothstep(0.,.012,e);
        float bev=1.-smoothstep(0.,.03,e);
        vec3 V=normalize(cameraPosition-vW);
        vec3 ab=mix(vec3(.84,.95,.27),vec3(.9,.97,.55),uQ);
        float velo=0.;
        if(uQ>.5)velo=smoothstep(.05,.6,fbm3(vO*2.4+3.1));   // velos lechosos del cuarzo
        if(uBack>.5){
          vec3 N=-Nf;float ndv=clamp(dot(N,V),0.,1.);
          vec3 r=refract(-V,-N,1.54);if(dot(r,r)<.01)r=reflect(-V,N);
          vec3 tr=textureLod(uEnv,r,3.6).rgb;
          vec3 col=tr*ab*ab*.55+uLima*ab*.09*(.6+.4*ndv);
          col+=vec3(.86,.95,.72)*velo*.14;
          col+=uLima*linea*.22;
          col+=uLima*vG*.22+uLima*linea*vG*1.2;
          gl_FragColor=vec4(col,1.);
          return;
        }
        vec3 N=normalize(mix(Nf,normalize(vS),bev*uBev));
        float ndv=clamp(dot(N,V),0.,1.);
        float F=.045+.955*pow(1.-ndv,5.);
        vec3 refl=textureLod(uEnv,reflect(-V,N),2.4).rgb;
        vec3 tint=uLima*ab*.12*(.5+.5*ndv)+vec3(.9,1.,.8)*(.03+velo*.05)*uQ;

      gt.mesh.scale.set(gt.r * (1 - sp * .18), gt.r * (1 - sp * .18), gt.r * (1 + sp * .7));
    }
  }

  // 06 Prisma: cara bajo el cursor
  let caraHud = -1, cr = prisma;
  for (const [k, X] of [[5, prisma]]) {
    let cara = -1;
    if (modo === k && dentro && X.aparece > .5) { const r = ray.intersectObject(X.mesh, false)[0]; if (r) { cara = X.face[r.faceIndex]; sobre = true; } }
    if (modo === k) caraHud = cara;
    const k1 = 1 - Math.exp(-dt * 14), k2 = Math.exp(-dt * 2.6);
    for (let f = 0; f < X.caras; f++) X.gl[f] = f === cara ? X.gl[f] + (1 - X.gl[f]) * k1 : X.gl[f] * k2;
    X.face.forEach((f, t) => { X.glow[t * 3] = X.glow[t * 3 + 1] = X.glow[t * 3 + 2] = X.gl[f]; });
    X.geo.attributes.aGlow.needsUpdate = true;
  }
  {
    const cara = caraHud;
    if (cara >= 0) {
      const pos = cr.geo.attributes.position, mw = cr.mesh.matrixWorld;
      const cen = new THREE.Vector3(), nrm = new THREE.Vector3(); let area = 0;
      for (const t of cr.tris[cara]) {
        a.fromBufferAttribute(pos, t * 3).applyMatrix4(mw); b.fromBufferAttribute(pos, t * 3 + 1).applyMatrix4(mw); c.fromBufferAttribute(pos, t * 3 + 2).applyMatrix4(mw);
        const cr_ = b.clone().sub(a).cross(c.clone().sub(a)), ar = cr_.length() / 2;
        area += ar; cen.addScaledVector(a.clone().add(b).add(c).divideScalar(3), ar); nrm.add(cr_);
      }
      cen.divideScalar(area); nrm.normalize();
      const ang = THREE.MathUtils.radToDeg(Math.acos(Math.min(1, Math.abs(nrm.dot(camera.position.clone().sub(cen).normalize())))));
      const sc = cen.clone().project(camera), sx = (sc.x * .5 + .5) * innerWidth, sy = (-sc.y * .5 + .5) * innerHeight;
      if (!hudPos.ok) { hudPos.x = sx; hudPos.y = sy; hudPos.ok = true; }
      hudPos.x += (sx - hudPos.x) * (1 - Math.exp(-dt * 18)); hudPos.y += (sy - hudPos.y) * (1 - Math.exp(-dt * 18));
      const lado = hudPos.x > innerWidth / 2 ? 1 : -1, largo = Math.min(120, innerWidth * .16), estrecho = innerWidth < 560;
      let ex = hudPos.x + lado * largo, ey = hudPos.y - largo * .45;
      if (estrecho) { // en móvil la etiqueta va encima del cristal, nunca tapándolo
        const top = tmp.set(0, 1.12 * cr.mesh.scale.x, 0).add(cr.mesh.position).project(camera);
        ex = hudPos.x; ey = (-top.y * .5 + .5) * innerHeight - 14; }
      hc.setAttribute('cx', hudPos.x); hc.setAttribute('cy', hudPos.y);
      hl.setAttribute('x1', hudPos.x); hl.setAttribute('y1', hudPos.y); hl.setAttribute('x2', ex); hl.setAttribute('y2', ey);
      ht.innerHTML = `<em>Cara ${String(cara + 1).padStart(2, '0')}/${cr.caras}</em><br>Área ${fmt(area, 2)} u²<br>Ángulo ${fmt(ang, 1)}°`;
      const tw = ht.offsetWidth;
      let lx = estrecho ? ex - tw / 2 : (lado > 0 ? ex + 8 : ex - 8 - tw); lx = Math.max(8, Math.min(innerWidth - tw - 8, lx));
      ht.style.transform = `translate(${lx}px,${estrecho ? ey - ht.offsetHeight - 4 : ey - 30}px)`;
      hud.style.opacity = 1;
    } else { hud.style.opacity = 0; hudPos.ok = false; }
  }

  bloom.strength += ([.1, .06, .06, .14, .1, .26][modo] - bloom.strength) * (1 - Math.exp(-dt * 6));
  if (sobre !== P.sobre) { P.sobre = sobre; document.body.classList.toggle('sobre', sobre); }
  composer.render(dt);
  if (EMBED && !window.__avisada && t - T0 > .25) { window.__avisada = true; avisar('lista'); }
  if (!STILL) requestAnimationFrame(frame); else window.__listo = true;
}
requestAnimationFrame(frame);
window.__elegir = elegir; window.__dbg = {chicle, aceite, niebla};
